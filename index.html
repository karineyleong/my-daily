function openIdea(id){
  const dlg=$('dlg'),x=id?ideas.find(i=>i.id===id):{color:'#6C8EBF'};
  dlg.innerHTML=`<textarea id="i-t" rows="1" maxlength="100" placeholder="${t('ideaTitle')}" aria-label="${t('ideaTitle')}">${esc(x.title||'')}</textarea><textarea id="i-b" rows="8" placeholder="${t('ideaBody')}" aria-label="${t('ideaBody')}">${esc(x.body||'')}</textarea><div class="tbar"><input id="i-c" type="color" value="${esc(x.color||'#6C8EBF')}" aria-label="${t('color')}">${id?`<button class="sec" id="i-d">${t('del')}</button>`:''}<button class="pri snd" id="i-s" aria-label="${t('save')}">↑</button></div>`;
  $('i-s').onclick=async()=>{
    const v={title:$('i-t').value.trim(),body:$('i-b').value.trim(),color:$('i-c').value};if(!v.title&&!v.body)return;
    if(id){const{error}=await sb.from('ideas').update({...v,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);Object.assign(x,v)}
    else{const{data,error}=await sb.from('ideas').insert(v).select().single();if(error)return alert(error.message);ideas.push(data)}
    dlg.close();render();
  };
  if($('i-d'))$('i-d').onclick=async()=>{if(!confirm(t('confirmDel')))return;const{error}=await sb.from('ideas').delete().eq('id',id);if(error)return alert(error.message);ideas=ideas.filter(i=>i.id!==id);dlg.close();render()};
  dlg.showModal();$('i-t').focus();
}
function live(){
  if(ch)return;
  ch=sb.channel('sync').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(lt);lt=setTimeout(async()=>{if(session&&!$('dlg').open){await loadData();if(tab!=='set')render()}},500)}).subscribe();
}
function openSheet(id,pid){
  const par=pid?tasks.find(y=>y.id===pid):null,dlg=$('dlg');
  const x=id?tasks.find(y=>y.id===id):{importance:0,note:'',category_id:par?par.category_id:(cats.some(c=>c.id===view)?view:null),parent_id:pid||null};
  const hasK=id&&kids(id).length;
  dlg.innerHTML=`<textarea id="f-t" rows="2" maxlength="200" placeholder="${t('ph')}" aria-label="${t('title')}">${esc(x.title||'')}</textarea>
<textarea id="f-n" rows="2" placeholder="${t('note')}" aria-label="${t('note')}">${esc(x.note||'')}</textarea>
<div class="tbar"><input id="f-d" type="datetime-local" value="${x.due_at?toL(x.due_at):''}" aria-label="${t('due')}"><select id="f-i" aria-label="${t('imp')}">${[3,2,1,0].map(v=>`<option value="${v}"${x.importance===v?' selected':''}>🚩 ${t(['impN0','impL','impM','impH'][v])}</option>`).join('')}</select></div>
<div class="tbar"><select id="f-c" aria-label="${t('cat')}"><option value="">${t('inbox')}</option>${cats.map(c=>`<option value="${c.id}"${x.category_id===c.id?' selected':''}>${esc((c.icon||'')+' '+c.name)}</option>`).join('')}</select><button class="pri snd" id="f-s" aria-label="${t('save')}">↑</button></div>
${id&&!hasK?`<label for="f-p">${t('prog')}：<span id="pv">${x.progress||0}</span>%</label><input id="f-p" type="range" min="0" max="100" step="5" value="${x.progress||0}" oninput="document.getElementById('pv').textContent=this.value">`:''}
${id?`<div class="row">${x.parent_id?'':`<button class="sec" id="f-sub">＋ ${t('sub')}</button>`}<button class="sec" id="f-del">${t('del')}</button></div>`:''}`;
  $('f-s').onclick=async()=>{
    const title=$('f-t').value.trim();if(!title)return;
    const p=$('f-p')?+$('f-p').value:(x.progress||0);
    const v={title,note:$('f-n').value.trim()||null,importance:+$('f-i').value,due_at:$('f-d').value?new Date($('f-d').value).toISOString():null,category_id:$('f-c').value||null,progress:p};
    if($('f-p'))v.done=p===100;
    if(id){const{error}=await sb.from('tasks').update(v).eq('id',id);if(error)return alert(error.message);Object.assign(x,v)}
    else{v.parent_id=x.parent_id;const{data,error}=await sb.from('tasks').insert(v).select().single();if(error)return alert(error.message);tasks.push(data)}
    dlg.close();render();
  };
  if($('f-del'))$('f-del').onclick=async()=>{if(!confirm(t('confirmDel')))return;const{error}=await sb.from('tasks').delete().eq('id',id);if(error)return alert(error.message);const gone=[id,...kids(id).map(k=>k.id)];tasks=tasks.filter(y=>!gone.includes(y.id));dlg.close();render()};
  if($('f-sub'))$('f-sub').onclick=()=>{dlg.close();openSheet(null,id)};
  dlg.showModal();$('f-t').focus();
}
function openList(kind){kind=kind||'task';
  const dlg=$('dlg');
  dlg.innerHTML=`<label for="l-n">${t('listName')}</label><input id="l-n" type="text" maxlength="20"><label for="l-e">${t('emoji')}</label><input id="l-e" type="text" maxlength="8" placeholder="😀"><label for="l-c">${t('color')}</label><input id="l-c" type="color" value="#6C8EBF"><div class="row"><button class="sec" id="l-x">${t('cancel')}</button><button class="pri" id="l-s">${t('save')}</button></div>`;
  $('l-x').onclick=()=>dlg.close();
  $('l-s').onclick=async()=>{const n=$('l-n').value.trim();if(!n)return;const{data,error}=await sb.from('categories').insert({kind,name:n,icon:$('l-e').value.trim()||null,color:$('l-c').value,sort_order:cats.length}).select().single();if(error)return alert(error.message);(kind==='task'?cats:ecats).push(data);dlg.close();render()};
  dlg.showModal();$('l-n').focus();
}
async function setDone(id,v){
  const ids=[id,...kids(id).map(k=>k.id)],patch={done:v,progress:v?100:0};
  const{error}=await sb.from('tasks').update(patch).in('id',ids);
  if(error)alert(error.message);else tasks.forEach(x=>{if(ids.includes(x.id))Object.assign(x,patch)});
  render();
}
async function postpone(){
  const d=new Date();d.setHours(23,59,0,0);const ids=pool().filter(isOv).map(x=>x.id);if(!ids.length)return;
  const{error}=await sb.from('tasks').update({due_at:d.toISOString()}).in('id',ids);if(error)return alert(error.message);
  tasks.forEach(x=>{if(ids.includes(x.id))x.due_at=d.toISOString()});render();
}
$('dlg').addEventListener('click',e=>{if(e.target.id==='dlg')e.target.close()});
$('app').addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='dr'){dr=!dr;render()}
  else if(a==='nav'){view=b.dataset.v;tab='todo';dr=false;render()}
  else if(a==='set'){tab='set';dr=false;render()}
  else if(a==='tab'){tab=b.dataset.v;dr=false;render()}
  else if(a==='cday'){const[y,m,d]=b.dataset.v.split('-').map(Number);cs=new Date(y,m,d);render()}
  else if(a==='cmo'){cm=new Date(cm.getFullYear(),cm.getMonth()+ +b.dataset.v,1);render()}
  else if(a==='nidea')openIdea()
  else if(a==='exp')exportImg()
  else if(a==='bgdel'){if(bgPath)sb.storage.from('illustrations').remove([bgPath]);await setBgPath('')}
  else if(a==='hchk')await hToggle(id,b.checked)
  else if(a==='hedit')openHabit(id)
  else if(a==='nhabit')openHabit()
  else if(a==='nev')openEvent()
  else if(a==='eedit')openEvent(id)
  else if(a==='nle')openList('event')
  else if(a==='idea')openIdea(id)
  else if(a==='add')openSheet()
  else if(a==='edit')openSheet(id)
  else if(a==='nl'){dr=false;render();openList()}
  else if(a==='ovt'){ovOpen=!ovOpen;render()}
  else if(a==='pst')await postpone()
  else if(a==='chk')await setDone(id,b.checked)
  else if(a==='cdel'){if(confirm(t('confirmDel'))){const{error}=await sb.from('categories').delete().eq('id',id);if(error)alert(error.message);else{cats=cats.filter(c=>c.id!==id);ecats=ecats.filter(c=>c.id!==id);tasks.forEach(x=>{if(x.category_id===id)x.category_id=null});events.forEach(x=>{if(x.category_id===id)x.category_id=null});if(view===id)view='all';render()}}}
  else if(a==='lo')sb.auth.signOut();
});
$('app').addEventListener('change',async e=>{
  const el=e.target,d=el.dataset,id=d.cn||d.cc||d.ci;if(!id)return;
  const patch=d.cn?{name:el.value.trim()||'—'}:d.cc?{color:el.value}:{icon:el.value.trim()||null};
  const{error}=await sb.from('categories').update(patch).eq('id',id);if(error)return alert(error.message);Object.assign(anyCat(id),patch);
});
$('app').addEventListener('change',e=>{if(e.target.id==='bgf')upBg(e.target.files[0])});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&session&&!$('dlg').open)loadData().then(()=>{if(tab!=='set')render()})});
async function loadSettings(){
  const{data}=await sb.from('user_settings').select('language,theme_color,display_name').maybeSingle();
  if(data){lang=data.language||lang;color=data.theme_color||color;uname=data.display_name||'';localStorage.lang=lang;localStorage.color=color;localStorage.dname=uname}
  else await save();
}
async function loadBg(){
  const{data,error}=await sb.from('user_settings').select('bg_path').maybeSingle();
  bgPath=!error&&data&&data.bg_path?data.bg_path:'';bgUrl='';
  if(bgPath){const r=await sb.storage.from('illustrations').createSignedUrl(bgPath,86400);bgUrl=r.data?r.data.signedUrl:''}
  theme();
}
async function setBgPath(p){
  const{error}=await sb.from('user_settings').update({bg_path:p||null}).eq('user_id',session.user.id);
  if(error)return alert(error.message);
  bgPath=p||'';bgUrl='';
  if(p){const r=await sb.storage.from('illustrations').createSignedUrl(p,86400);bgUrl=r.data?r.data.signedUrl:''}
  theme();render();
}
async function upBg(f){
  if(!f)return;
  const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)}).catch(()=>null);
  if(!img)return alert(t('bgErr'));
  const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82)),path=`${session.user.id}/bg-${Date.now()}.jpg`;
  const up=await sb.storage.from('illustrations').upload(path,blob,{contentType:'image/jpeg'});
  if(up.error)return alert(up.error.message);
  const old=bgPath;await setBgPath(path);if(old)sb.storage.from('illustrations').remove([old]);
}
const bgCard=()=>`<div class="card"><b>${t('bgImg')}</b><p class="meta">${t('bgHint')}</p><div class="row"><label class="btn" for="bgf">${t('bgPick')}</label><input id="bgf" class="sr" type="file" accept="image/*">${bgUrl?`<button class="sec" data-a="bgdel">${t('bgDel')}</button>`:''}</div>${bgUrl?`<img class="thumb" src="${esc(bgUrl)}" alt="">`:''}</div>`;
function exportImg(){
  const y=cm.getFullYear(),m=cm.getMonth(),F='-apple-system,"Hiragino Sans","PingFang TC",sans-serif';
  const list=events.filter(e=>{const s=new Date(e.start_at);return s.getFullYear()===y&&s.getMonth()===m}).sort((a,b)=>a.start_at<b.start_at?-1:1);
  const W=1080,P=64,H0=220,RH=150,H=H0+Math.max(list.length,1)*RH+80,c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d'),cut=(s,w)=>{while(s.length>1&&g.measureText(s).width>w)s=s.slice(0,-1);return s};
  g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle=color;g.fillRect(0,0,W,170);g.textBaseline='middle';
  g.fillStyle=onColor(color);g.font=`700 56px ${F}`;g.fillText(uname?uname+'’s Daily':'My Daily',P,64);
  g.font=`400 36px ${F}`;g.fillText(new Date(y,m,1).toLocaleDateString(LOC[lang],{year:'numeric',month:'long'}),P,126);
  if(!list.length){g.fillStyle='#66727D';g.font=`400 36px ${F}`;g.fillText(t('noItems'),P,H0+40)}
  list.forEach((e,i)=>{
    const yy=H0+i*RH,cc=catOf(e.category_id);
    g.fillStyle=cc&&cc.color||color;g.fillRect(P,yy-20,10,RH-34);
    g.fillStyle='#1F2A33';g.font=`700 40px ${F}`;g.fillText(cut(e.title,W-P*2-40),P+36,yy);
    g.fillStyle='#66727D';g.font=`400 32px ${F}`;
    g.fillText(new Date(e.start_at).toLocaleDateString(LOC[lang],{month:'numeric',day:'numeric',weekday:'short'})+' '+hm(e.start_at)+(e.end_at?' – '+hm(e.end_at):''),P+36,yy+46);
    if(e.location)g.fillText(cut('📍 '+e.location,W-P*2-40),P+36,yy+86);
  });
  c.toBlob(b=>{
    const f=new File([b],'schedule.png',{type:'image/png'}),u=URL.createObjectURL(b),dlg=$('dlg');
    dlg.innerHTML=`<img src="${u}" alt="" style="width:100%;border-radius:10px;border:1px solid var(--ln)"><p class="meta">${t('shareHint')}</p><div class="row"><button class="sec" id="x-c">${t('cancel')}</button><button class="pri" id="x-s">${t('share')}</button></div>`;
    $('x-c').onclick=()=>dlg.close();
    $('x-s').onclick=async()=>{try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'My Daily'});else{const a=document.createElement('a');a.href=u;a.download='schedule.png';a.click()}}catch(e){}};
    dlg.showModal();
  });
}
sb.auth.onAuthStateChange((_e,s)=>{session=s;setTimeout(async()=>{try{if(s){await loadSettings();await loadBg();await loadData();live()}else{uname='';localStorage.removeItem('dname');bgPath='';bgUrl='';theme();if(ch){sb.removeChannel(ch);ch=null}tasks=[];cats=[];ideas=[];habits=[];hlogs=[];events=[];ecats=[];tab='todo';view='all'}}catch(e){}render()},0)});
setTimeout(()=>{if(!rendered)render()},2500);
sb.auth.getSession().then(({data})=>{if(!data.session){session=null;render()}});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
