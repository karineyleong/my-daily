async function hToggle(id,on){

}

async function upBg(f){
  if(!f)return;
  const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)}).catch(()=>null);
  if(!img)return alert(t('bgErr'));
  const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82)),path=`${session.user.id}/bg-${Date.now()}.jpg`;
  const up=await sb.storage.from('illustrations').upload(path,blob,{contentType:'image/jpeg'});
  if(up.error)return alert(up.error.message);
  const old=bgPath;await setBgPath(path);if(old)sb.storage.from('illustrations').remove([old]);
}

function exportImg(){
  const y=cm.getFullYear(),m=cm.getMonth(),F='-apple-system,"Hiragino Sans","PingFang TC",sans-serif';
  const list=events.filter(e=>{const s=new Date(e.start_at);return s.getFullYear()===y&&s.getMonth()===m}).sort((a,b)=>a.start_at<b.start_at?-1:1);
  const W=1080,P=64,H0=220,RH=150,H=H0+Math.max(list.length,1)*RH+80,c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d'),cut=(s,w)=>{while(s.length>1&&g.measureText(s).width>w)s=s.slice(0,-1);return s};
  g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle=color;g.fillRect(0,0,W,170);g.textBaseline='middle';
  g.fillStyle=onColor(color);g.font=`700 56px ${F}`;g.fillText(uname?uname+'’s Daily':'My Daily',P,64);
  g.font=`400 36px ${F}`;g.fillText(new Date(y,m,1).toLocaleDateString(LOC[lang],{year:'numeric',month:'long'}),P,126);
  if(!list.length){g.fillStyle='#66727D';g.font=`400 36px ${F}`;g.fillText(t('noItems'),P,H0+40)}
  list.forEach((e,i)=>{
    const yy=H0+i*RH,cc=ecats.find(z=>z.id===e.category_id);
    g.fillStyle=cc&&cc.color||color;g.fillRect(P,yy-20,10,RH-34);
    g.fillStyle='#1F2A33';g.font=`700 40px ${F}`;g.fillText(cut(e.title,W-P*2-40),P+36,yy);
    g.fillStyle='#66727D';g.font=`400 32px ${F}`;
    g.fillText(new Date(e.start_at).toLocaleDateString(LOC[lang],{month:'numeric',day:'numeric',weekday:'short'})+' '+hm(e.start_at)+(e.end_at?' – '+hm(e.end_at):''),P+36,yy+46);
    if(e.location)g.fillText(cut('📍 '+e.location,W-P*2-40),P+36,yy+86);
  });
  c.toBlob(b=>{
    const f=new File([b],'schedule.png',{type:'image/png'}),u=URL.createObjectURL(b),dlg=$('dlg');
    dlg.innerHTML=`<img src="${u}" alt="" style="width:100%;border-radius:10px;border:1px solid var(--ln)"><p class="meta">${t('shareHint')}</p><div class="row"><button class="sec" id="x-c">${t('cancel')}</button><button class="pri" id="x-s">${t('share')}</button></div>`;
    $('x-c').onclick=()=>dlg.close();
    $('x-s').onclick=async()=>{try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'My Daily'});else{const a=document.createElement('a');a.href=u;a.download='schedule.png';a.click()}}catch(e){}};
    dlg.showModal();
  });
}
sb.auth.onAuthStateChange((_e,s)=>{session=s;setTimeout(async()=>{try{if(s){await loadSettings();await loadBg();await loadData();live()}else{uname='';localStorage.removeItem('dname');bgPath='';bgUrl='';theme();if(ch){sb.removeChannel(ch);ch=null}tasks=[];cats=[];ideas=[];habits=[];hlogs=[];events=[];ecats=[];tab='todo';view='all'}}catch(e){}render()},0)});
setTimeout(()=>{if(!rendered)render()},2500);
sb.auth.getSession().then(({data})=>{if(!data.session){session=null;render()}});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
