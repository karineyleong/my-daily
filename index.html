/* ===== v25: shopping page (two columns, left slightly wider) ===== */
/* v26: minmax(0,...) tracks + min-width:0 items — nowrap chip rows inside a column
   must never inflate the track minimum and push the other column off-screen. */
.shop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:start}
.shop>*{min-width:0}
.shop .card{padding:10px;margin-bottom:0;min-width:0}
.shop .chips{min-width:0}
.shop .task{padding:9px 0;gap:6px;min-width:0}
.shop .tbar input{padding:9px;font-size:14px}
.shop .tbar button{padding:9px 12px}
.shop .chips{padding-bottom:6px}
/* ===== v27: dropdown list pickers on the shopping page ===== */
.selrow{display:flex;gap:6px;align-items:center;margin-bottom:6px;min-width:0}
.selrow select{flex:1;min-width:0;width:auto;padding:9px;font-size:14px}
.selrow .ic{flex:none}
/* v29: day nav on ONE row — ‹ date › side by side, vertically centred. */
.dhd{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:4px;flex-wrap:nowrap}
.dhd b{font-size:var(--fs4);text-align:center;line-height:1.35;flex:1;min-width:0;white-space:nowrap}
.dhd .ic{padding:4px 8px;font-size:16px;flex:none}
.dhd .sp{flex:1}
/* ===== v28: history rows in the shopping drawer (nav + pin + rename) ===== */
.hrow{display:flex;align-items:center;gap:6px}
.hrow .di{flex:1;width:auto;min-width:0}
.hrow .ic{flex:none;padding:6px 9px;font-size:15px}
.pinb{opacity:.35}
.pinb.on{opacity:1;background:color-mix(in srgb,var(--ac) 22%,transparent);border-color:transparent}

/* ===== v29: per-item memo line under a shopping item's name (small, grey) ===== */
.memo{font-size:var(--fs5);color:var(--mut);margin-top:1px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;cursor:pointer}
.memo .madd{opacity:.55}
.memo.ro{cursor:default}

/* ===== v23 ===== */
.card{margin-bottom:18px}
.ghd{margin:18px 2px 10px}
main{padding-bottom:132px}
.task{padding:14px 0}

async function dedupCats(){

      habits.forEach(h=>{if(h.list_id===did)h.list_id=keep.id});
      litems.forEach(i=>{if(i.list_id===did)i.list_id=keep.id});
      tasks.forEach(x=>{if(x.category_id===did)x.category_id=keep.id});
      events.forEach(x=>{if(x.category_id===did)x.category_id=keep.id});
      try{await sb.from('categories').delete().eq('id',did)}catch(_){}

async function dedupDays(){

  // legitimately hold several NAMED lists, so only same-name rows are race
  // duplicates. Keep the earliest-created row; re-point its items; delete the rest.
  const groups={};
  dlists.forEach(d=>{const k=d.list_date+'|'+(d.name||'');(groups[k]=groups[k]||[]).push(d)});
  for(const k in groups){
    const g=groups[k];if(g.length<2)continue;
    g.sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||'')));

function beepDone(actx){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const ctx=actx||new AC();
    if(ctx.state==='suspended')ctx.resume();
    const t0=ctx.currentTime+0.02;
    [880,880,1175].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=f;
      o.connect(g);g.connect(ctx.destination);
      const st=t0+i*0.3;
      g.gain.setValueAtTime(0.0001,st);
      g.gain.exponentialRampToValueAtTime(0.22,st+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,st+0.26);
      o.start(st);o.stop(st+0.28);
    });
    if(!actx)setTimeout(()=>{try{ctx.close()}catch(_){}},1800);
  }catch(_){}
}

// ================= v25: Shopping page (left: to-buy master lists / right: per-day shopping list) =================
// Master items live in list_items (list_id -> categories kind='shop').
// Day items are COPIES in day_list_items (src_id remembers the master item) —
// the two sides never delete each other; only manual deletes remove rows.
const fmtDay=ds=>{const p=String(ds).split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1).toLocaleDateString(LOC[lang],{year:'numeric',month:'long',day:'numeric',weekday:'short'})};
// v26: compact one-line date for the narrow day-list header (date + weekday kept in full).
const fmtDayS=ds=>{const p=String(ds).split('-').map(Number);const d=new Date(p[0],(p[1]||1)-1,p[2]||1);const wd=d.toLocaleDateString(LOC[lang],{weekday:'short'});return p[0]+'/'+pad(p[1]||1)+'/'+pad(p[2]||1)+(lang==='en'?' ('+wd+')':'（'+wd+'）')};
// v29: the day-nav header sits BETWEEN the ‹ › buttons on a single row. In the
// half-width column the full fmtDayS string (year + parenthesised weekday)
// overflows its flex cell and paints over the buttons, so the nav header uses
// month/day + weekday only. The year stays where there is room for it: the
// drawer history rows (fmtDayS) and the share text (fmtDay).
const fmtDayNav=ds=>{const p=String(ds).split('-').map(Number);const d=new Date(p[0],(p[1]||1)-1,p[2]||1);const wd=d.toLocaleDateString(LOC[lang],{weekday:'short'});return (p[1]||1)+'/'+(p[2]||1)+' '+wd};
const daysOf=ds=>dlists.filter(d=>d.list_date===ds).sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||'')));
// v27: display name of a day list. Legacy rows (created before v27) carry no
// name yet and fall back to the generic title; degraded mode (no name column)
// always shows the generic title.
const dayName=d=>d?(dayNameV27?(d.name||t('listsPage')):t('listsPage')):'';
// The day list a date currently targets: the dropdown pick when it belongs to
// that date, otherwise the earliest list of the day.
const curDayList=ds=>{const g=daysOf(ds);if(!g.length)return null;return g.find(d=>d.id===shopDay)||g[0]};
const dayItemsOf=dl=>dl?ditems.filter(i=>i.day_list_id===dl.id).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)||(a.created_at<b.created_at?-1:1)):[];
// v29: memo line under a shopping item's name. Editable rows carry data-a so a
// tap opens the memo editor (the innermost [data-a] wins, so it never toggles
// the item); the To Do reflection passes ro=1 and renders read-only text.
// Hidden entirely until sql-v29.sql adds the note columns (noteV29 probe).
const memoLine=(a,id,note,ro)=>{if(!noteV29)return '';if(ro)return note?`<div class="memo ro">${esc(note)}</div>`:'';
  return `<div class="memo" data-a="${a}" data-id="${id}">${note?esc(note):`<span class="madd">＋ ${t('memo')}</span>`}</div>`};
// v29: edit one item's memo. Master items write list_items, day copies write
// day_list_items — the two sides never write through to each other, exactly
// like titles. An emptied memo is stored as NULL.
function openMemo(kind,id){
  const it=kind==='litem'?litems.find(x=>x.id===id):ditems.find(x=>x.id===id);if(!it)return;
  const dlg=$('dlg');
  dlg.innerHTML=`<label for="mm-t">${t('memo')}</label><input id="mm-t" type="text" maxlength="200" placeholder="${t('memoPh')}" value="${esc(it.note||'')}"><div class="row"><button class="sec" id="mm-x">${t('cancel')}</button><button class="pri" id="mm-s">${t('save')}</button></div>`;
  $('mm-x').onclick=()=>dlg.close();
  $('mm-s').onclick=async()=>{const n=$('mm-t').value.trim()||null;
    const{error}=await sb.from(kind==='litem'?'list_items':'day_list_items').update({note:n}).eq('id',id);if(error)return alert(error.message);
    it.note=n;dlg.close();render()};
  dlg.showModal();const inp=$('mm-t');inp.focus();try{inp.select()}catch(_){}
}
let _dayP=null;
function ensureDayList(ds){
  const ex=curDayList(ds);
  if(ex)return Promise.resolve(ex);
  if(_dayP)return _dayP;
  // First pick of the day auto-creates a list named after the master list the
  // item came from (renameable later). Without the v27 name column the insert
  // omits it — the app then behaves exactly like the single-list v25/v26 one.
  const cur=slists.find(c=>c.id===shopList);
  const v={list_date:ds};if(dayNameV27)v.name=cur?catName(cur):t('listsPage');
  const p=(async()=>{const{data,error}=await sb.from('day_lists').insert(v).select().single();if(error){alert(error.message);return null}dlists.push(data);shopDay=data.id;return data})();
  _dayP=p;const cl=()=>{if(_dayP===p)_dayP=null};p.then(cl,cl);
  return p;
}
async function toggleShopItem(it){
  // Core rule: selecting NEVER deletes the master item; unselecting only removes the day copy.
  // v27: the copy lands in the day list currently picked in the right column.
  const td=ymd(new Date());
  const dl=curDayList(td);
  const ex=dl?ditems.find(x=>x.day_list_id===dl.id&&x.src_id===it.id):null;
  if(ex){
    const{error}=await sb.from('day_list_items').delete().eq('id',ex.id);if(error)return alert(error.message);
    ditems=ditems.filter(x=>x.id!==ex.id);
  }else{
    const day=await ensureDayList(td);if(!day)return;
    const v={day_list_id:day.id,title:it.title,src_id:it.id,sort_order:ditems.filter(x=>x.day_list_id===day.id).length};
    if(noteV29)v.note=it.note||null; // v29: the memo copies with the title; afterwards the two sides are independent
    const{data,error}=await sb.from('day_list_items').insert(v).select().single();if(error)return alert(error.message);
    ditems.push(data);
  }
  render();
}
function shopShareText(ds){
  const dl=curDayList(ds),its=dayItemsOf(dl);
  // v29: an item with a memo gets the memo on the next line, indented two spaces.
  return '🛒 '+t('listsPage')+'\n'+fmtDay(ds)+(dayNameV27&&dl?'\n'+dayName(dl):'')+(its.length?'\n'+its.map(i=>(i.done?'☑ ':'☐ ')+i.title+(noteV29&&i.note?'\n  '+i.note:'')).join('\n'):'');
}
async function shareDayList(){
  const tx=shopShareText(shopDate||ymd(new Date()));
  if(navigator.share){try{await navigator.share({title:t('listsPage'),text:tx});return}catch(e){if(e&&e.name==='AbortError')return}}
  if(navigator.clipboard&&navigator.clipboard.writeText){try{await navigator.clipboard.writeText(tx);say(t('copied2'));return}catch(_){}}
  const dlg=$('dlg');
  dlg.innerHTML=`<label for="sh-t">${t('shareBtn')}</label><textarea id="sh-t" rows="8" readonly>${esc(tx)}</textarea><div class="row"><button class="pri" id="sh-x">${t('done')}</button></div>`;
  $('sh-x').onclick=()=>dlg.close();
  if(!dlg.open)dlg.showModal();
}
function shopHTML(){
  if(!shopV25)return drawer()+`<div class="hd"><button class="sec ic" data-a="dr" aria-label="${t('menu')}">☰</button><span></span></div><div class="card"><p class="meta">${t('shopSql')}</p></div>`;
  const td=ymd(new Date()),vd=shopDate||td;
  if(shopList&&!slists.some(c=>c.id===shopList))shopList=null;
  if(!shopList&&slists.length)shopList=slists[0].id;
  const cur=slists.find(c=>c.id===shopList);
  const dl=curDayList(vd);
  if(dl&&shopDay!==dl.id)shopDay=dl.id;
  const selIds=new Set(dayItemsOf(curDayList(td)).map(i=>i.src_id));
  const mIts=cur?litems.filter(i=>i.list_id===cur.id).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)||(a.created_at<b.created_at?-1:1)):[];
  // v27: master lists are picked from a dropdown — only the picked list's items show.
  const left=`<div class="card"><div class="dsec" style="margin-top:0">${t('master')}</div>`
    +(slists.length?`<div class="selrow"><select data-shopsel="master" aria-label="${t('master')}">${slists.map(c=>`<option value="${c.id}"${c.id===shopList?' selected':''}>${esc(c.icon||'🛒')} ${esc(catName(c))}</option>`).join('')}</select><button class="sec ic" data-a="sladd" aria-label="${t('newList')}">＋</button></div>`
      :`<div class="row" style="margin:0 0 4px"><button class="sec mini" data-a="sladd">＋ ${t('newList')}</button></div>`)
    +(cur?`<div class="row" style="margin:0 0 4px"><button class="sec mini" data-a="sledit" data-id="${cur.id}">✎ ${t('edit')}</button><button class="sec mini" data-a="sldel" data-id="${cur.id}">${t('del')}</button></div>`
      +(mIts.length?mIts.map(i=>swpWrap('litem',i.id,`<div class="task"><input type="checkbox" class="pc" style="--pc:#43A047" data-a="stog" data-id="${i.id}"${selIds.has(i.id)?' checked':''} aria-label="${t('chk')}"><div class="tt" data-a="stog" data-id="${i.id}"><b>${esc(i.title)}</b>${memoLine('smemo',i.id,i.note)}</div><button class="sec mini" data-a="siedit" data-id="${i.id}" aria-label="${t('edit')}">✎</button></div>`)).join(''):`<p class="meta">${t('liEmpty')}</p>`)
      +`<div class="tbar"><input id="si-n" type="text" maxlength="120" placeholder="${t('slPh')}"><button class="pri" data-a="siadd" data-id="${cur.id}" aria-label="${t('liAdd')}">＋</button></div>`
    :`<p class="meta">${t('slNone')}</p>`)
    +`</div>`;
  const dgs=daysOf(vd),dIts=dayItemsOf(dl),dn=dIts.filter(i=>i.done).length;
  // v27: a day may hold several NAMED lists — picked from a dropdown like the left column.
  // Day items have NO edit button (removed by request); tick + swipe-remove only.
  // v29 FIX: the day item's .tt now carries data-a="dtog" like every other row
  // type (master items wire .tt with stog, tasks with edit). Before v29 the ONLY
  // wired element was the 22px checkbox — taps on the title / row body (the
  // natural tap target, ~85% of the row) hit closest('[data-a]') === null and
  // the delegated click handler returned without doing anything, which read on
  // a real phone as "day items cannot be ticked". The dtog handler derives the
  // new state from the checkbox when the checkbox itself was tapped, and from
  // !it.done when the title/row was tapped.
  const daySel=dayNameV27?`<div class="selrow"><select data-shopsel="day" aria-label="${t('todayList')}"${dgs.length?'':' disabled'}>${dgs.map(d=>`<option value="${d.id}"${dl&&d.id===dl.id?' selected':''}>${esc(dayName(d))}</option>`).join('')}</select><button class="sec ic" data-a="dladd" aria-label="${t('newList')}">＋</button></div>`
    +(dl?`<div class="row" style="margin:0 0 4px"><button class="sec mini" data-a="dledit" data-id="${dl.id}">✎ ${t('edit')}</button><button class="sec mini" data-a="dldel" data-id="${dl.id}">${t('del')}</button></div>`:''):'';
  const right=`<div class="card"><div class="dsec" style="margin-top:0">${t('todayList')}</div>`
    +`<div class="dhd"><button class="sec ic" data-a="dday" data-v="-1" aria-label="‹">‹</button><b>${fmtDayNav(vd)}</b><button class="sec ic" data-a="dday" data-v="1" aria-label="›"${vd>=td?' disabled style="opacity:.3"':''}>›</button></div>`
    +(vd!==td?`<button class="lnk" data-a="dtoday">${t('backToday')}</button>`:'')
    +daySel
    +(dIts.length?`<div class="meta">${dn}/${dIts.length}</div>`+dIts.map(i=>swpWrap('ditem',i.id,`<div class="task${i.done?' done':''}"><input type="checkbox" class="pc" style="--pc:#8A96A0" data-a="dtog" data-id="${i.id}"${i.done?' checked':''} aria-label="${t('chk')}"><div class="tt" data-a="dtog" data-id="${i.id}"><b>${esc(i.title)}</b>${memoLine('dmemo',i.id,i.note)}</div></div>`)).join(''):`<p class="meta">${vd===td?t('dayEmpty'):t('dayNone')}</p>`)
    +(dIts.length?`<div class="row"><button class="pri" data-a="dshare">📤 ${t('shareBtn')}</button></div>`:'')
    +`</div>`;

// v27: today's shopping lists as a section on the To Do page — a second VIEW of

// v26: edit a shopping item's text — writes list_items only.
// v27: day-list copies are intentionally NOT editable (the day column's edit
// button was removed by request), so this only ever serves master items.
function openItemEdit(kind,id){
  if(kind!=='litem')return;
  const it=litems.find(x=>x.id===id);if(!it)return;

  const chips=`<div class="chips">${['A1','A2','B1','B2'].map(x=>`<button class="chip${courseLvl===x?' on':''}" data-a="ctab" data-v="${x}">${x}</button>`).join('')}</div>`;
  const exam=`<div class="card"><b>🏆 ${t('cilsExam')} · CILS ${courseLvl}</b><p class="meta" style="white-space:pre-wrap">${esc(lv.exam)}</p><p class="meta">${t('progW')}：${addedN} / ${allW.length}</p><div class="bar"><i style="width:${allW.length?Math.round(addedN/allW.length*100):0}%"></i></div></div>`;
  const qDoneN=new Set(squiz.filter(r=>r.language_id===L.id&&r.level===courseLvl).map(r=>r.topic)).size;
  const qcard=`<div class="card"><b>📝 ${t('quizT')} · ${courseLvl}</b><p class="meta">${t('qProg')}：${qDoneN} / ${lv.grammar.length}</p><div class="row"><button class="pri" data-a="qmix" data-v="${courseLvl}">${t('mixQuiz')}（10）</button></div></div>`;
  const gram=`<div class="ghd"><b>${t('grammarL')}</b><span class="meta">${lv.grammar.length}</span></div><div class="card">${lv.grammar.map((g,i)=>{const k=courseLvl+'-'+i,open=expG.has(k),lr=squiz.find(r=>r.language_id===L.id&&r.level===courseLvl&&r.topic===g.t);return `<div class="task"><div class="tt" data-a="gtog" data-v="${k}" style="cursor:pointer"><b>${open?'▾':'▸'} ${esc(g.t)}</b>${open?`<div class="meta" style="white-space:pre-wrap">${esc(g.d)}</div>${g.ex.map(e=>`<div class="meta">🇮🇹 ${esc(e[0])}<br>　${esc(e[1])}</div>`).join('')}<div class="row" style="margin-top:8px"><button class="sec" data-a="qstart" data-v="${i}">📝 ${t('doQuiz')}${g.q?'（'+g.q.length+'）':''}</button>${lr?`<span class="meta">${t('qLast')}：${lr.score}/${lr.total}</span>`:''}</div>`:''}</div></div>`}).join('')}</div>`;
  const packs=lv.packs.map((p,pi)=>`<div class="ghd"><b>${esc(p.n)}</b>${p.w.every(w=>have.has(w[0].trim().toLowerCase()))?`<span class="meta">${t('addedW')} ✓</span>`:`<button class="sec" data-a="caddall" data-v="${pi}">${t('addAll')}</button>`}</div><div class="card">${p.w.map((wd,wi)=>{const has=have.has(wd[0].trim().toLowerCase());return `<div class="task"><div class="tt"><b>${esc(wd[0])}</b> <span class="meta">${esc(wd[1])} · ${esc(wd[2])}</span>${TTS?` <button class="lnk" data-a="tts" data-v="${esc(wd[0])}" aria-label="play">🔊</button>`:''}<div class="meta">${esc(wd[3])}${TTS?` <button class="lnk" data-a="tts" data-v="${esc(wd[3])}" aria-label="play">🔊</button>`:''}</div><div class="meta">${esc(wd[4])}</div></div>${has?`<span class="meta">${t('addedW')}</span>`:`<button class="sec" data-a="cadd" data-v="${pi}:${wi}">${t('addW')}</button>`}</div>`}).join('')}</div>`).join('');
  return chips+exam+qcard+gram+`<div class="ghd"><b>${t('packL')}</b><span class="meta">${allW.length}</span></div>`+packs;
}
let firedRem={};try{firedRem=JSON.parse(localStorage.firedRem||'{}')}catch(e){}
function occStarts(e,from,to){
  const st=+new Date(e.start_at),kind=e.repeat_kind||'none';
  if(kind==='none')return st>=from&&st<=to?[st]:[];
  const step=d=>{const n=new Date(d);if(kind==='daily')n.setDate(n.getDate()+1);else if(kind==='weekly')n.setDate(n.getDate()+7);else if(kind==='monthly')n.setMonth(n.getMonth()+1);else if(kind==='yearly')n.setFullYear(n.getFullYear()+1);return n};
  let cur=new Date(st),g=0;const out=[];
  while(+cur<from&&g++<3000)cur=step(cur);
  g=0;while(+cur<=to&&g++<500){if(+cur>=from)out.push(+cur);cur=step(cur)}
  return out;
}
async function fireNotif(title,body,tag){
  if(!('Notification'in window)||Notification.permission!=='granted')return false;
  try{if('serviceWorker'in navigator){const reg=await navigator.serviceWorker.ready;if(reg){await reg.showNotification(title,{body,tag,icon:'icon-192.png'});return true}}}catch(e){}
  try{new Notification(title,{body,tag,icon:'icon-192.png'});return true}catch(e){return false}
}
function remBanner(e,os){
  const old=document.querySelector('.remb');if(old)old.remove();
  const d=document.createElement('div');d.className='remb';
  const s=document.createElement('span');s.textContent='🔔 '+fmt(os)+' '+(e.title||'');
  const b=document.createElement('button');b.textContent='✕';b.setAttribute('aria-label','close');b.onclick=()=>d.remove();
  d.appendChild(s);d.appendChild(b);document.body.appendChild(d);
  setTimeout(()=>{if(d.parentNode)d.remove()},20000);
}
function checkReminders(){
  if(!session||!events.length)return;
  const now=Date.now(),WIN=30*6e4;let dirty=false;
  events.forEach(e=>{
    const rlist=(evV20&&Array.isArray(e.remind_list)&&e.remind_list.length)?e.remind_list:(e.remind_min!=null?[e.remind_min]:[]);
    rlist.forEach(rmin=>{
      const rm=rmin*6e4;
      occStarts(e,now-WIN+rm,now+rm).forEach(os=>{
        const rt=os-rm;if(rt>now||now-rt>WIN)return;
        const key=e.id+'|'+rt;
        if(firedRem[key])return;
        firedRem[key]=1;dirty=true;
        fireNotif('🔔 '+(e.title||''),fmt(os)+(e.location?' 📍'+e.location:''),'rem-'+key);
        remBanner(e,os);
      });
    });
  });
  const cut=now-7*864e5;
  for(const k in firedRem){if(+k.split('|')[1]<cut){delete firedRem[k];dirty=true}}
  if(dirty)localStorage.firedRem=JSON.stringify(firedRem);
}
let remTimer=null;
function startRem(){checkReminders();if(!remTimer)remTimer=setInterval(checkReminders,30000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders()});
sb.auth.onAuthStateChange((_e,s)=>{session=s;try{if(s)localStorage.mdsess=JSON.stringify({user:{id:s.user.id,email:s.user.email}});else localStorage.removeItem('mdsess')}catch(e){}setTimeout(async()=>{try{if(s){await loadSettings();await loadBg();await loadData();if(!OFFLINE&&_sbReal)live();startRem()}else{uname='';localStorage.removeItem('dname');bgPath='';bgUrl='';theme();if(ch){sb.removeChannel(ch);ch=null}tasks=[];cats=[];ideas=[];habits=[];hlogs=[];events=[];ecats=[];slists=[];litems=[];dlists=[];ditems=[];shopList=null;shopDate=null;shopDay=null;tab='todo';view='all'}}catch(e){}render()},0)});
setTimeout(()=>{if(!rendered)render()},2500);
sb.auth.getSession().then(({data})=>{if(!data.session){session=null;render()}});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
